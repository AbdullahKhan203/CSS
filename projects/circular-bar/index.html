<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./script.js"></script>
    <title>cir-cular-bar</title>
</head>
<body>
    <div class="container">
  <!-- Circle 1 -->
  <div class="circle" data-degree="25" data-color="#ff2972">
    <h4 class="number">25<span>%</span></h4> 
    <h4>HTML</h4> 
  </div>

  <!-- Circle 2 -->
  <div class="circle" data-degree="50" data-color="#ff2972">
    <h4 class="number">50<span>%</span></h4>
    <h4>CSS</h4>
  </div>

  <!-- Circle 3 -->
  <div class="circle" data-degree="75" data-color="#ff2972">
    <h4 class="number">75<span>%</span></h4>
    <h4>JS</h4>
  </div>
</div>
</body>
</html>
