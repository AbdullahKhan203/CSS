<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
    <title>circular progress bar</title>
</head>
<body>
    <div class="container">
        <div class="circle" data-degree="99.99" data-color="pink">
          <h4 class="number">99.99<span>%</span></h4>
          <h4>HTML</h4>
        </div>
        <div class="circle" data-degree="99" data-color="yellow">
          <h4 class="number">99.99<span>%</span></h4>
          <h4>CSS</h4>
        </div>
        <div class="circle" data-degree="75" data-color="green">
          <h4 class="number">75<span>%</span></h4>
          <h4>JS</h4>
        </div>
    </div>
</body>
</html>
