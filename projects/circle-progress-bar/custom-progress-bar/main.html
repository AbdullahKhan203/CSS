<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Progress Circle with Ticks</title>
</head>
<body>
    <div class="container">
        <div class="circle" data-degree="25" data-color="pink">
            <div class="progress-ticks"></div>
            <h1 class="number">25%</h1>
            <h1 class="skill">HTML</h1>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
