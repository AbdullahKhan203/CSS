<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Pseudo-elements Profile Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <div class="profile-pic"></div>
    <h2 class="name">John Doe</h2>
    <p class="bio">
      Passionate front-end developer who loves crafting elegant UIs and learning new web technologies.
    </p>

    <ul class="skills">
      <li>HTML5</li>
      <li>CSS3</li>
      <li>JavaScript</li>
    </ul>

    <form class="contact-form">
      <input type="text" placeholder="Your name" required />
      <input type="email" placeholder="Email address" required />
      <input type="file" />
    </form>
  </div>

</body>
</html>
